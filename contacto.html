<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles.css">
    <title>Formulario</title>
</head>
<body>
    <div class="form_container">
        <div>
            <h1>Contactanos</h1>
            <form action="contacto" method="post" class="form_contacto">
                <label for="input1">Nombre</label>
                <input id="input1" type="text" required>
                <label for="input2">Telefono</label>
                <input id="input2" type="tel" placeholder="123-456-7891" required>
                <label for="input3">Mensaje</label>
                <textarea name="Mensaje" id="input3" placeholder="Deja tu mensaje aqui" required></textarea>
                <input type="submit" name="ENVIAR" id="submit">
            </form>
        </div>
    </div>
</body>
</html>
